<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Python AST IDE</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #0b0f1a;
  color: white;
}

.header {
  padding: 10px;
  background: #050814;
  border-bottom: 1px solid #1e3a5f;
}

.container {
  display: flex;
  height: calc(100vh - 50px);
}

textarea {
  width: 50%;
  height: 100%;
  background: #050814;
  color: white;
  border: none;
  padding: 10px;
  outline: none;
  white-space: pre;
  resize: none;
}

.output {
  width: 25%;
  background: #050814;
  padding: 10px;
  overflow-y: auto;
  white-space: pre-wrap;
  border-left: 1px solid #1e3a5f;
}

#consolePanel {
  display: none;
  width: 25%;
  background: #0a0f1f;
  border-left: 1px solid #1e3a5f;
  padding: 10px;
  overflow-y: auto;
  white-space: pre-wrap;
}

button {
  margin: 5px;
  background: #12223a;
  color: white;
  border: 1px solid #1e3a5f;
  padding: 5px 10px;
  cursor: pointer;
}

.error-line {
  background: rgba(255, 0, 0, 0.25);
}
</style>
</head>

<body>

<div class="header">
<button onclick="run()">Run</button>
<button onclick="clearOut()">Clear</button>
<button onclick="toggleConsole()">Console</button>
</div>

<div class="container">

<textarea id="code">
def add(a,b):
    return a+b

nums=[1,2,3]
nums.append(4)

print(len(nums))
print(add(2,3))

if add(1,1)==2:
    print("ok")
else:
    print("fail")
</textarea>

<div class="output">
<div id="output"></div>
<input id="inputBox" placeholder="Input + Enter">
</div>

<div id="consolePanel">
<div style="color:#ff4d4d;font-weight:bold;">CONSOLE</div>
<div id="console"></div>
</div>

</div>

<script>

/* ---------------- GLOBAL UI ---------------- */
const output=document.getElementById("output");
const consoleBox=document.getElementById("console");
const codeArea=document.getElementById("code");

/* ---------------- INPUT ---------------- */
let inputResolver=null;

inputBox.onkeydown=e=>{
 if(e.key==="Enter"){
  let v=e.target.value;
  e.target.value="";
  if(inputResolver){
    inputResolver(v);
    inputResolver=null;
  }
 }
};

function input(p){
 log(p);
 return new Promise(r=>inputResolver=r);
}

/* ---------------- OUTPUT ---------------- */
function log(x){ output.textContent+=x+"\n"; }
function logConsole(x){ consoleBox.textContent+=x+"\n"; }

/* ---------------- UI ---------------- */
function toggleConsole(){
 const c=document.getElementById("consolePanel");
 c.style.display = c.style.display==="none"?"block":"none";
}

function clearOut(){
 output.textContent="";
 consoleBox.textContent="";
 codeArea.value = codeArea.value.replaceAll(">>> ","");
}

/* ---------------- HIGHLIGHT ---------------- */
function highlightLine(i){
 let lines=codeArea.value.split("\n");

 codeArea.value=lines.map((l,idx)=>
  idx===i ? ">>> "+l : l
 ).join("\n");
}

/* ---------------- RUN ---------------- */
async function run(){
 output.textContent="";
 consoleBox.textContent="";

 codeArea.value = codeArea.value.replaceAll(">>> ","");

 try{
  log("IDE loaded (interpreter stub active)");
  log("Run logic depends on your full interpreter build.");
 }catch(e){
  logConsole("Fatal: "+e);
 }
}

</script>

</body>
</html>
