<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Launcher</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0f1a;
  font-family: monospace;
  color: white;
}

button {
  padding: 20px;
  font-size: 18px;
  background: #12223a;
  border: 1px solid #1e3a5f;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<button onclick="openIDE()">Launch Python AST IDE</button>

<script>
function openIDE() {
  window.open(
    "ide.html",
    "PythonIDE",
    "width=1200,height=800,left=200,top=100"
  );
}
</script>

</body>
</html>
