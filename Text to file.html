<!DOCTYPE html>
<html>
<head>
  <title>Code File Generator</title>
  <style>
    body {
      font-family: Arial;
      background: #1e1e1e;
      color: white;
      padding: 20px;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font-size: 14px;
    }

    textarea {
      height: 200px;
      background: #111;
      color: #0f0;
      border: none;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Code File Generator</h2>

<label>Select Language:</label>
<select id="lang">
  <option value="html">HTML</option>
  <option value="py">Python</option>
  <option value="js">JavaScript</option>
  <option value="txt">Text</option>
  <option value="css">CSS</option>
</select>

<label>File name (no extension):</label>
<input type="text" id="filename" placeholder="my_code">

<label>Write your code:</label>
<textarea id="code"></textarea>

<button onclick="saveFile()">Download File</button>

<script>
function saveFile() {
  const lang = document.getElementById("lang").value;
  let name = document.getElementById("filename").value.trim();
  const code = document.getElementById("code").value;

  if (!name) name = "file";

  const filename = name + "." + lang;

  const blob = new Blob([code], { type: "text/plain" });
  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = filename;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>

</body>
</html>
