<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Python AST Interpreter</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #0b0f1a;
  color: white;
}

.header {
  padding: 10px;
  background: #050814;
  border-bottom: 1px solid #1e3a5f;
}

.container {
  display: flex;
  height: calc(100vh - 50px);
}

textarea {
  width: 50%;
  height: 100%;
  background: #050814;
  color: white;
  border: none;
  padding: 10px;
  resize: none;
  outline: none;
}

.output {
  width: 50%;
  background: #050814;
  padding: 10px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.output::before {
  content: "OUTPUT";
  display: block;
  color: #4aa3ff;
  font-weight: bold;
  margin-bottom: 10px;
}

#inputBox {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  background: #0b0f1a;
  color: white;
  border: 1px solid #1e3a5f;
}

button {
  margin: 5px;
  background: #12223a;
  color: white;
  border: 1px solid #1e3a5f;
  padding: 5px 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
<button onclick="run()">Run</button>
<button onclick="clearOut()">Clear</button>
</div>

<div class="container">
<textarea id="code">
def add():
    a = input("Enter a:")
    b = input("Enter b:")
    print(a)
    print(b)

add()

nums = [1,2,3]
nums.append(4)
print(nums[3])
</textarea>

<div class="output">
<div id="output"></div>
<input id="inputBox" placeholder="Type input + Enter">
</div>
</div>

<script>

/* ---------------- INPUT SYSTEM ---------------- */
let inputResolver = null;

document.getElementById("inputBox").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    let v = e.target.value;
    e.target.value = "";
    if (inputResolver) {
      inputResolver(v);
      inputResolver = null;
    }
  }
});

function input(promptText) {
  log(promptText);
  return new Promise(res => inputResolver = res);
}

/* ---------------- OUTPUT ---------------- */
function log(x) {
  document.getElementById("output").textContent += x + "\n";
}

/* ---------------- AST NODE TYPES ---------------- */
class Node {
  constructor(type, value = null, children = []) {
    this.type = type;
    this.value = value;
    this.children = children;
  }
}

/* ---------------- INDENT PARSER → AST ---------------- */
function parse(lines, indent = 0, i = {v:0}) {
  let nodes = [];

  while (i.v < lines.length) {
    let line = lines[i.v];
    if (!line.trim()) { i.v++; continue; }

    let curIndent = line.match(/^ */)[0].length;
    if (curIndent < indent) break;

    line = line.trim();

    /* FUNCTION */
    if (line.startsWith("def ")) {
      let name = line.split("def ")[1].split("(")[0].trim();
      i.v++;

      let body = parse(lines, curIndent + 4, i);
      nodes.push(new Node("func", name, body));
    }

    /* IF */
    else if (line.startsWith("if ")) {
      let cond = line.slice(3, -1);
      i.v++;

      let body = parse(lines, curIndent + 4, i);
      nodes.push(new Node("if", cond, body));
    }

    /* FOR */
    else if (line.startsWith("for ")) {
      let v = line.split("for ")[1].split(" in")[0].trim();
      let n = line.match(/range\((\d+)\)/)[1];
      i.v++;

      let body = parse(lines, curIndent + 4, i);
      nodes.push(new Node("for", {v, n}, body));
    }

    else {
      nodes.push(new Node("stmt", line));
      i.v++;
    }
  }

  return nodes;
}

/* ---------------- EXECUTOR ---------------- */
async function exec(nodes, env = {}) {

  for (let n of nodes) {

    /* FUNCTION DEF */
    if (n.type === "func") {
      env[n.value] = async () => await exec(n.children, env);
    }

    /* IF */
    else if (n.type === "if") {
      if (evalExpr(n.value, env)) {
        await exec(n.children, env);
      }
    }

    /* FOR */
    else if (n.type === "for") {
      for (let i = 0; i < n.value.n; i++) {
        env[n.value.v] = i;
        await exec(n.children, env);
      }
    }

    /* STATEMENT */
    else if (n.type === "stmt") {
      await runStmt(n.value, env);
    }
  }
}

/* ---------------- STATEMENT RUNNER ---------------- */
async function runStmt(line, env) {

  if (line.startsWith("print(")) {
    let v = line.slice(6, -1);
    log(evalExpr(v, env));
  }

  else if (line.includes("input(")) {
    let name = line.split("=")[0].trim();
    let prompt = line.match(/input\((.*)\)/);
    let p = prompt ? eval(prompt[1]) : "";

    env[name] = await input(p);
  }

  else if (line.includes(".append")) {
    let list = line.split(".append")[0].trim();
    let val = line.match(/\.append\((.*)\)/)[1];

    env[list].push(evalExpr(val, env));
  }

  else if (line.includes("=")) {
    let [l, r] = line.split("=");
    env[l.trim()] = evalExpr(r.trim(), env);
  }
}

/* ---------------- EXPRESSION EVAL ---------------- */
function evalExpr(expr, env) {
  try {
    return Function("env", "with(env){return " + expr + "}")(env);
  } catch {
    return expr;
  }
}

/* ---------------- RUN ---------------- */
async function run() {
  document.getElementById("output").textContent = "";

  const code = document.getElementById("code").value;
  const lines = code.split("\n");

  const ast = parse(lines, 0, {v:0});
  await exec(ast, {});
}

/* ---------------- CLEAR ---------------- */
function clearOut() {
  document.getElementById("output").textContent = "";
}

</script>

</body>
</html>
