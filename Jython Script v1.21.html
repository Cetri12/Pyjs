<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hybrid Python + JS Interpreter</title>

<style>
body {
  margin: 0;
  font-family: monospace;
  background: #0b0f1a;
  color: white;
}

.header {
  padding: 10px;
  background: #050814;
  border-bottom: 1px solid #1e3a5f;
}

.container {
  display: flex;
  height: calc(100vh - 50px);
}

textarea {
  width: 50%;
  height: 100%;
  background: #050814;
  color: #d6eaff;
  border: none;
  padding: 10px;
  resize: none;
  outline: none;
}

.output {
  width: 50%;
  background: #050814;
  padding: 10px;
  overflow-y: auto;
  font-size: 14px;
}

.output-line {
  margin-bottom: 4px;
}

.str { color: #7ee787; }
.num { color: #79c0ff; }
.err { color: #ff7b72; }
.sys { color: #a5d6ff; }

#inputBox {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  background: #0b0f1a;
  color: white;
  border: 1px solid #1e3a5f;
}

button {
  margin: 5px;
  background: #12223a;
  color: white;
  border: 1px solid #1e3a5f;
  padding: 5px 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
<button onclick="run()">Run</button>
<button onclick="clearOut()">Clear</button>
<button onclick="downloadHTML()">Download HTML</button>
<button onclick="downloadJS()">Download JS</button>
</div>

<div class="container">
<textarea id="code">
def demo():
    print("hello world")
    print('single quotes work')

    x = 5
    y = js("return x * 3")
    print(y)

    js("log('JS sees x=' + x)")

demo()
</textarea>

<div class="output">
<div id="output"></div>
<input id="inputBox" placeholder="Type input + Enter">
</div>
</div>

<script>

/* ---------------- INPUT ---------------- */
let inputResolver = null;

document.getElementById("inputBox").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    let v = e.target.value;
    e.target.value = "";
    if (inputResolver) {
      inputResolver(v);
      inputResolver = null;
    }
  }
});

function input(promptText) {
  log(promptText, "sys");
  return new Promise(res => inputResolver = res);
}

/* ---------------- OUTPUT ---------------- */
function log(value, type = "auto") {
  const out = document.getElementById("output");
  const line = document.createElement("div");
  line.className = "output-line";

  let cls = "";

  if (type === "sys") cls = "sys";
  else if (type === "err") cls = "err";
  else if (typeof value === "number") cls = "num";
  else if (typeof value === "string") cls = "str";

  line.innerHTML = `<span class="${cls}">${escapeHTML(String(value))}</span>`;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}

function escapeHTML(str) {
  return str.replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------------- SAFE JS ---------------- */
function runJS(code, env) {
  const safeAPI = { log, Math };

  return Function("env", "api", `
    const { log, Math } = api;
    with(env) {
      return (function(){
        ${code}
      })();
    }
  `)(env, safeAPI);
}

/* ---------------- AST ---------------- */
class Node {
  constructor(type, value = null, children = []) {
    this.type = type;
    this.value = value;
    this.children = children;
  }
}

/* ---------------- PARSER ---------------- */
function parse(lines, indent = 0, i = {v:0}) {
  let nodes = [];

  while (i.v < lines.length) {
    let line = lines[i.v];
    if (!line.trim()) { i.v++; continue; }

    let curIndent = line.match(/^ */)[0].length;
    if (curIndent < indent) break;

    line = line.trim();

    if (line.startsWith("def ")) {
      let name = line.split("def ")[1].split("(")[0].trim();
      i.v++;
      let body = parse(lines, curIndent + 4, i);
      nodes.push(new Node("func", name, body));
    }

    else {
      nodes.push(new Node("stmt", line));
      i.v++;
    }
  }

  return nodes;
}

/* ---------------- EXEC ---------------- */
async function exec(nodes, env = {}) {
  for (let n of nodes) {

    if (n.type === "func") {
      env[n.value] = async () => await exec(n.children, env);
    }

    else {
      await runStmt(n.value, env);
    }
  }
}

/* ---------------- STRING CHECK ---------------- */
function isStringLiteral(expr) {
  return (
    (expr.startsWith('"') && expr.endsWith('"')) ||
    (expr.startsWith("'") && expr.endsWith("'"))
  );
}

/* ---------------- STATEMENTS ---------------- */
async function runStmt(line, env) {

  if (line.startsWith("print(")) {
    let v = line.slice(6, -1).trim();
    log(evalExpr(v, env));
  }

  else if (line.includes("input(")) {
    let name = line.split("=")[0].trim();
    let prompt = line.match(/input\((.*)\)/);
    let p = prompt ? evalExpr(prompt[1], env) : "";
    env[name] = await input(p);
  }

  else if (line.startsWith("js(")) {
    let code = line.slice(3, -1);
    runJS(code, env);
  }

  else if (line.includes("=")) {
    let [l, r] = line.split("=");

    r = r.trim();

    if (r.startsWith("js(")) {
      let code = r.slice(3, -1);
      env[l.trim()] = runJS(code, env);
    }
    else {
      env[l.trim()] = evalExpr(r, env);
    }
  }
}

/* ---------------- EXPRESSIONS ---------------- */
function evalExpr(expr, env) {

  expr = expr.trim();

  // STRING literal (safe)
  if (isStringLiteral(expr)) {
    return expr.slice(1, -1);
  }

  try {
    return Function("env", "with(env){return " + expr + "}")(env);
  } catch (e) {
    log("Error: " + e.message, "err");
    return null;
  }
}

/* ---------------- RUN ---------------- */
async function run() {
  document.getElementById("output").innerHTML = "";

  const code = document.getElementById("code").value;
  const lines = code.split("\n");

  const ast = parse(lines, 0, {v:0});
  await exec(ast, {});
}

/* ---------------- CLEAR ---------------- */
function clearOut() {
  document.getElementById("output").innerHTML = "";
}

/* ---------------- DOWNLOAD JS ---------------- */
function downloadJS() {
  const code = document.getElementById("code").value;
  const blob = new Blob([code], { type: "text/javascript" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "script.js";
  a.click();
}

/* ---------------- DOWNLOAD HTML ---------------- */
function downloadHTML() {
  const code = document.getElementById("code").value;

  const html = `<!DOCTYPE html>
<html>
<body>
<pre id="out"></pre>
<script>
function log(x){document.getElementById("out").textContent += x + "\\n";}
let env = {};
${code}
<\/script>
</body>
</html>`;

  const blob = new Blob([html], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "program.html";
  a.click();
}

</script>

</body>
</html>
